# VPS tunggal: Caddy (HTTPS otomatis) -> Next.js. Database memakai Neon/Supabase (gratis) sehingga tidak ada Postgres lokal.
# Pakai:  cd deploy && docker compose --env-file ../.env.production up -d --build
services:
  app:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    env_file: ../.env.production
    expose: ["3000"]
    read_only: true
    tmpfs: ["/tmp", "/app/.next/cache"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy: { resources: { limits: { memory: 768M } } }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?isi DOMAIN di .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  caddy_data:
  caddy_config:
